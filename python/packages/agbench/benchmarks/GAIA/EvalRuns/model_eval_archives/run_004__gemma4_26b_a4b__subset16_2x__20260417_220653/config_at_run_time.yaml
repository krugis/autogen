#######################
# Used by MagenticOne #
#######################
# Orchestrator uses structured JSON (LedgerEntry) for planning.
# Use a bounded cap to avoid runaway 30k-token completions while keeping room for JSON output.
orchestrator_client:
  <<: *client_base
  config:
    <<: *client_cfg
    max_tokens: 24576

# Let tool-using agents return longer outputs when needed.
coder_client:
  <<: *client_base
  config:
    <<: *client_cfg
    max_tokens: 12288

web_surfer_client:
  <<: *client_base
  config:
    <<: *client_cfg
    max_tokens: 8192

file_surfer_client:
  <<: *client_base
  config:
    <<: *client_cfg
    max_tokens: 8192
