#######################
# Used by MagenticOne #
#######################
# Keep orchestrator concise to preserve prompt headroom in 24k models.
# Orchestrator uses structured JSON (LedgerEntry) for planning; Gemma outputs verbose JSON.
# No completion cap here — prompts are small (~1-5k) so 24k window is not threatened.
orchestrator_client: *client_base

# Let tool-using agents return longer outputs when needed.
coder_client:
  <<: *client_base
  config:
    <<: *client_cfg
    max_tokens: 3072

web_surfer_client:
  <<: *client_base
  config:
    <<: *client_cfg
    max_tokens: 2048

file_surfer_client:
  <<: *client_base
  config:
    <<: *client_cfg
    max_tokens: 2048
